name: pipeline

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Show files
        run: ls -la

      - name: Pull
        run: git pull origin main